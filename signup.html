<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Harmony TCM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { tcm: { charcoal: '#2D3748', dark: '#1A202C', ivory: '#FAF9F6', sand: '#F5F0E6', terracotta: '#C87968', sage: '#9CAAA0', } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'], } } } }
    </script>

    <style type="text/tailwindcss">
        @layer base {
          html {
            scroll-behavior: smooth;
            transition: background-color 0.3s ease, color 0.3s ease;
          }
          body {
            @apply font-sans antialiased text-tcm-charcoal bg-tcm-ivory;
            transition: background-color 0.3s ease, color 0.3s ease;
          }
          html.dark body {
            @apply text-tcm-sand bg-tcm-dark;
          }
          h1, h2, h3, h4, h5, h6 {
            @apply font-display tracking-tight;
          }
        }
        @layer components {
          .btn-primary {
            @apply inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-tcm-terracotta hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tcm-terracotta transition-colors duration-200;
          }
          .btn-secondary {
            @apply inline-flex items-center justify-center px-6 py-3 border border-tcm-charcoal text-base font-medium rounded-md text-tcm-charcoal bg-transparent hover:bg-tcm-charcoal hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tcm-charcoal transition-colors duration-200 dark:border-tcm-sand dark:text-tcm-sand dark:hover:bg-tcm-sand dark:hover:text-tcm-dark;
          }
          .nav-link {
            @apply text-base font-medium text-tcm-charcoal hover:text-tcm-terracotta transition-colors duration-200 dark:text-tcm-sand dark:hover:text-tcm-sage relative;
          }
          .nav-link.active::after {
            content: '';
            @apply absolute bottom-[-4px] left-0 w-full h-[2px] bg-tcm-terracotta dark:bg-tcm-sage rounded-full;
          }
          .card {
            @apply bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden border border-gray-100 dark:border-gray-700;
          }
          ::-webkit-scrollbar-thumb {
            @apply bg-gray-300 dark:bg-gray-600 rounded-full;
          }
          ::-webkit-scrollbar-thumb:hover {
            @apply bg-tcm-sage;
          }
          .label-desc-grid {
            @apply grid grid-cols-[120px_1fr] md:grid-cols-[160px_1fr] gap-4 items-start;
          }
        }
    </style>
    <link rel="icon" type="image/jpeg" href="images/tcm_logo_new.jpg">
</head>
<body class="bg-tcm-ivory text-tcm-charcoal dark:bg-tcm-dark dark:text-tcm-sand font-sans min-h-screen flex items-center justify-center p-4 py-12" style="background-image: url('images/tcm_hero_1_1789906976315.jpg'); background-size: cover; background-position: center; background-blend-mode: overlay; background-color: rgba(250, 249, 246, 0.9);">

    <div class="fixed top-4 right-4 z-50">
        <div class="flex items-center gap-1 bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border border-gray-200 dark:border-gray-700 rounded-full p-1 shadow-sm">
            <button id="theme-toggle" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" aria-label="Toggle Theme">
                <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg class="w-5 h-5 hidden dark:block text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
            <button id="rtl-toggle" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors font-medium text-sm" aria-label="Toggle RTL">
                RL
            </button>
        </div>
    </div>
    <div class="card w-full max-w-md p-8 bg-white/95 dark:bg-gray-900/95 backdrop-blur-lg">
        <div class="text-center mb-8">
            <a href="index.html" class="flex items-center justify-center gap-3 mb-4 hover:opacity-80 transition-opacity">
                <img src="images/tcm_logo_new.jpg" alt="Harmony TCM Logo" class="h-12 w-auto rounded-md">
                <span class="font-display font-semibold text-3xl tracking-wide">Harmony TCM</span>
            </a>
            <h1 class="text-xl font-display text-gray-600 dark:text-gray-300">Create Portal Account</h1>
            <p class="text-gray-500 text-sm mt-2 font-light">Begin your healing journey.</p>
        </div>

        <form data-validate="true" class="space-y-4" action="dashboard.html">
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" required class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 outline-none focus:border-tcm-terracotta">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" required class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 outline-none focus:border-tcm-terracotta">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Phone</label>
                <input type="tel" required class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 outline-none focus:border-tcm-terracotta">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <div class="relative">
                    <input type="password" required minlength="8" class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 outline-none focus:border-tcm-terracotta pr-12">
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none" onclick="togglePassword(this)">
                        <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <svg class="w-5 h-5 eye-slash-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Confirm Password</label>
                <div class="relative">
                    <input type="password" required minlength="8" class="w-full px-4 py-3 rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 outline-none focus:border-tcm-terracotta pr-12">
                    <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none" onclick="togglePassword(this)">
                        <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <svg class="w-5 h-5 eye-slash-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex items-start text-sm mt-2">
                <input type="checkbox" required class="mt-1 rounded border-gray-300 text-tcm-terracotta focus:ring-tcm-terracotta">
                <span class="ml-2 text-gray-500 font-light text-xs">I agree to the <a href="#" class="text-tcm-terracotta">Terms of Service</a> and <a href="#" class="text-tcm-terracotta">Privacy Policy</a> regarding my medical data.</span>
            </div>

            <button type="submit" class="btn-primary w-full py-3 text-lg font-medium mt-4">Create Account</button>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300 dark:border-gray-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white dark:bg-gray-900 text-gray-500">Or continue with</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button type="button" class="flex items-center justify-center w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="flex items-center justify-center w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16.365 21.444c-1.507.039-2.45-.634-3.518-.634-1.085 0-2.316.634-3.612.634-3.69 0-7.398-3.483-7.398-8.777 0-4.041 2.37-6.275 4.887-6.275 1.579 0 2.81.936 3.731.936 1.002 0 2.45-.968 4.091-.968 1.47 0 2.827.426 3.829 1.468-3.082 1.838-2.585 6.079.467 7.241-.955 2.658-2.684 5.312-4.996 5.312-1.371 0-2.316-.937-3.481-.937zm-2.883-16.147c.507-1.565-.572-3.161-2.072-3.483-.45.029-.938.211-1.341.528-.426.331-.762.802-.977 1.353-.25.641-.285 1.346-.109 2.016.536.035 1.056-.168 1.488-.501.446-.341.761-.832.946-1.385l.065-.528z"/>
                    </svg>
                    Apple
                </button>
            </div>
        </form>

        <div class="text-center mt-6 text-sm">
            <span class="text-gray-500">Already have an account?</span>
            <a href="login.html" class="text-tcm-terracotta hover:underline font-medium">Log in here</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });
    </script>
    <script>
        function togglePassword(btn) {
            const container = btn.closest('.relative');
            const input = container.querySelector('input');
            const eye = btn.querySelector('.eye-icon');
            const eyeSlash = btn.querySelector('.eye-slash-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eye.classList.add('hidden');
                eyeSlash.classList.remove('hidden');
            } else {
                input.type = 'password';
                eye.classList.remove('hidden');
                eyeSlash.classList.add('hidden');
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
